name: Verify State

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Restore state
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            last_processed.json
            last_brand_fact_post.txt
            failed_posts.txt
            published_source_posts.txt
            facts_history.json
            last_published_brand.txt
          key: reposter-state-${{ github.run_id }}
          restore-keys: |
            reposter-state-

      - name: Show restored state
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          echo "--- last_processed.json ---"
          cat last_processed.json 2>/dev/null || echo "NO FILE"
          echo "--- last_published_brand.txt ---"
          cat last_published_brand.txt 2>/dev/null || echo "NO FILE"
