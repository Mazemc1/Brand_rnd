name: Telegram Reposter

on:
  schedule:
    # UTC: 06:00, 11:00, 16:00 → MSK: 09:00, 14:00, 19:00
    - cron: '0 6,11,16 * * *'
  workflow_dispatch:
    inputs:
      only_brand_fact:
        description: '🎯 Опубликовать ТОЛЬКО факт-пост (игнорировать источники)'
        type: choice
        options: ['Нет', 'Да']
        default: 'Нет'
      force_brand_fact:
        description: '⚡ Опубликовать факт-пост немедленно (в обычном режиме)'
        type: choice
        options: ['Нет', 'Да']
        default: 'Нет'
      force_full_repost:
        description: '🔄 Перепроверить последние 20 постов в каждом канале'
        type: choice
        options: ['Нет', 'Да']
        default: 'Нет'
      skip_state_push:
        description: '🚫 НЕ сохранять состояние в репозиторий (для тестов)'
        type: boolean
        default: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: telegram-reposter-${{ github.ref }}
      cancel-in-progress: false  # Не прерывать текущий запуск

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Нужен для пуша в ветку state

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📥 Install dependencies
        run: |          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # === ВОССТАНОВЛЕНИЕ СОСТОЯНИЯ ===
      - name: 🔄 Restore state from 'state' branch
        id: restore-state
        run: |
          echo "🔄 Пытаемся восстановить состояние из ветки 'state'..."
          
          # Проверяем, существует ли ветка state
          if git ls-remote --heads origin refs/heads/state | grep -q 'state'; then
            echo "✅ Ветка 'state' найдена, скачиваем файлы..."
            
            # Создаём временную директорию и копируем файлы
            mkdir -p .state-tmp
            git worktree add -f .state-tmp state 2>/dev/null || true
            
            # Копируем файлы состояния, если они есть
            for file in last_processed.json last_brand_fact_post.txt failed_posts.txt published_source_posts.txt last_published_brand.txt; do
              if [ -f ".state-tmp/$file" ]; then
                cp ".state-tmp/$file" "$file"
                echo "📄 Восстановлен: $file"
              fi
            done
            
            # Убираем worktree
            git worktree remove -f .state-tmp 2>/dev/null || true
          else
            echo "⚠️ Ветка 'state' не найдена — начинаем с чистого состояния"
          fi
          
          # Создаём пустые файлы, если их нет (защита от ошибок скрипта)
          touch last_processed.json failed_posts.txt published_source_posts.txt last_published_brand.txt last_brand_fact_post.txt
          
          # Показываем текущее состояние (для логов)
          echo "📋 Текущие файлы состояния:"
          ls -la *.json *.txt 2>/dev/null || echo "(файлы отсутствуют)"

      # === ЗАПУСК ОСНОВНОГО СКРИПТА ===
      - name: 🚀 Run Telegram Reposter
        env:
          # Telegram API credentials
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          
          # GigaChat API (Base64 client_id:client_secret)
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}
          
          # MAX.ru (временно отключено, но оставляем для будущего)          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID }}
          
          # Flags from workflow dispatch
          ONLY_BRAND_FACT: ${{ github.event.inputs.only_brand_fact == 'Да' && '1' || '0' }}
          FORCE_BRAND_FACT: ${{ github.event.inputs.force_brand_fact == 'Да' && '1' || '0' }}
          FORCE_FULL_REPOST: ${{ github.event.inputs.force_full_repost == 'Да' && '1' || '0' }}
          
          # Runtime metadata
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          
        run: |
          echo "⚙️ Параметры запуска:"
          echo "  ONLY_BRAND_FACT: $ONLY_BRAND_FACT"
          echo "  FORCE_BRAND_FACT: $FORCE_BRAND_FACT"
          echo "  FORCE_FULL_REPOST: $FORCE_FULL_REPOST"
          echo "  GITHUB_RUN_ID: $GITHUB_RUN_ID"
          echo ""
          
          echo "📦 Файлы состояния перед запуском:"
          cat last_processed.json 2>/dev/null || echo "(пусто)"
          echo ""
          
          # Запуск основного скрипта
          python repost.py
          
          echo ""
          echo "✅ Скрипт завершён"

      # === СОХРАНЕНИЕ СОСТОЯНИЯ В РЕПОЗИТОРИЙ ===
      - name: 💾 Save state to 'state' branch
        if: always() && github.event.inputs.skip_state_push != 'true'
        continue-on-error: true
        run: |
          echo "💾 Сохраняем состояние в ветку 'state'..."
          
          # Конфигурация git для бота
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Создаём или переключаемся на ветку state
          git fetch origin state:state 2>/dev/null || true
          git checkout -B state origin/state 2>/dev/null || git checkout --orphan state
          
          # Очищаем ветку и копируем актуальные файлы состояния
          git rm -rf . 2>/dev/null || true
          cp -f last_processed.json last_brand_fact_post.txt failed_posts.txt published_source_posts.txt last_published_brand.txt . 2>/dev/null || true
          
          # Добавляем .gitkeep чтобы ветка не была пустой          mkdir -p .github && touch .github/.gitkeep
          
          # Коммитим только если есть изменения
          git add -A
          if git diff --staged --quiet; then
            echo "ℹ️ Изменений в файлах состояния нет — пропускаем коммит"
          else
            git commit -m "chore(state): update @ $(date -u '+%Y-%m-%d %H:%M UTC') [run:${{ github.run_number }}]"
            echo "📤 Пушим в ветку 'state'..."
            git push -f origin state
            echo "✅ Состояние сохранено"
          fi
          
          # Возвращаемся на основную ветку
          git checkout - 2>/dev/null || true

      # === ЛОГИРОВАНИЕ И ОТЛАДКА ===
      - name: 📊 Show execution summary
        if: always()
        run: |
          echo ""
          echo "📋 === ИТОГИ ЗАПУСКА ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Status: ${{ job.status }}"
          echo ""
          echo "📄 Файлы состояния после выполнения:"
          for file in last_processed.json last_brand_fact_post.txt failed_posts.txt published_source_posts.txt; do
            if [ -f "$file" ]; then
              echo "▼ $file ($(wc -c < "$file") bytes):"
              head -5 "$file"
              echo "..."
            fi
          done

      # === УВЕДОМЛЕНИЕ ОБ ОШИБКАХ (опционально) ===
      - name: ⚠️ Notify on failure
        if: failure()
        run: |
          echo "❌ Воркфлоу завершился с ошибкой!"
          echo "Проверьте логи выше и файлы: failed_posts.txt"
          # Здесь можно добавить отправку уведомления в Telegram, если нужно
          # curl -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" ...
