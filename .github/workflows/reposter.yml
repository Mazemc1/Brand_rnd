name: Reposter

on:
  schedule:
    - cron: '0 6,11,16 * * *'  # UTC → Москва: 9, 14, 19
  workflow_dispatch:
    inputs:
      only_brand_fact:
        description: 'Опубликовать ТОЛЬКО факт-пост (игнорировать источники)'
        type: choice
        options:
          - 'Нет'
          - 'Да'
        default: 'Нет'
      force_brand_fact:
        description: 'Опубликовать факт-пост немедленно (в обычном режиме)'
        type: choice
        options:
          - 'Нет'
          - 'Да'
        default: 'Нет'
      force_full_repost:
        description: 'Перепроверить последние 20 постов в каждом канале'
        type: choice
        options:
          - 'Нет'
          - 'Да'
        default: 'Нет'

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show installed versions
        run: pip freeze

      # === Восстановление состояния между запусками (один общий кэш) ===
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            last_processed.json
            last_brand_fact_post.txt
            failed_posts.txt
            published_source_posts.txt
            facts_history.json
            last_published_brand.txt
          key: reposter-state-${{ github.run_id }}
          restore-keys: |
            reposter-state-

      # === Запуск скрипта ===
      - name: Run Reposter
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID }}
          ONLY_BRAND_FACT: ${{ github.event.inputs.only_brand_fact == 'Да' && '1' || '0' }}
          FORCE_BRAND_FACT: ${{ github.event.inputs.force_brand_fact == 'Да' && '1' || '0' }}
          FORCE_FULL_REPOST: ${{ github.event.inputs.force_full_repost == 'Да' && '1' || '0' }}
        run: python -X faulthandler repost.py

      # === Сохранение состояния (даже при ошибке) ===
      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reposter-state
          path: |
            last_processed.json
            last_brand_fact_post.txt
            failed_posts.txt
            published_source_posts.txt
            facts_history.json
            last_published_brand.txt
          if-no-files-found: ignore
