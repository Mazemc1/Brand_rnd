name: Seed State

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Write state files
        run: |
          cat > last_processed.json <<'EOF'
          {"brand_shop_usa": 175307, "brand_shop_in_russia": 9986, "shoppogolikhm": 452517}
          EOF
          python3 -c "from datetime import datetime; open('last_brand_fact_post.txt','w').write(datetime.now().isoformat())"
          printf 'Nike' > last_published_brand.txt
          printf '{}' > facts_history.json
          : > failed_posts.txt
          : > published_source_posts.txt

      - name: Save state cache
        uses: actions/cache/save@v4
        with:
          path: |
            last_processed.json
            last_brand_fact_post.txt
            last_published_brand.txt
            facts_history.json
            failed_posts.txt
            published_source_posts.txt
          key: reposter-state-seed-${{ github.run_id }}
